{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Detalle del Estudiante</h2>
    <div class="card" style="width: 18rem;">
        <div class="card-body">
            <h5 class="card-title">{{ estudiante.nombre }} {{ estudiante.apellido }}</h5>
            <p class="card-text"><strong>Email:</strong> {{ estudiante.email }}</p>
            <a href="{% url 'myapp:editar_estudiante' estudiante.pk %}" class="btn btn-warning btn-sm">Editar</a>
            <a href="{% url 'myapp:estudiantes' %}" class="btn btn-secondary btn-sm">Volver</a>
        </div>
    </div>
</div>
{% endblock %}
