{% extends 'base.html' %}

{% block title %}
Cursos
{% endblock %}

{% block content %}

<h1>Lista de Cursos</h1>

<a href="{% url 'myapp:cursoFormulario' %}">
    Agregar Curso
</a>

<hr>

{% for curso in cursos %}

    <p>
        <strong>{{ curso.nombre }}</strong> - Camada {{ curso.camada }}
    </p>

{% empty %}

    <p>No hay cursos cargados.</p>

{% endfor %}

{% endblock %}
