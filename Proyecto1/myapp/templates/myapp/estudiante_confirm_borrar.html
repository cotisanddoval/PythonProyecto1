{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Eliminar Estudiante</h2>
    <p>¿Estás seguro de que deseas eliminar al estudiante <strong>{{ estudiante.nombre }} {{ estudiante.apellido }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'myapp:estudiantes' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
