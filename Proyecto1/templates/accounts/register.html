{% extends 'base.html' %}

{% block title %}Registro - Sistema Académico{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-12 col-md-6 col-lg-5">
        
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="p-4 text-center" style="background-color: #631925;">
                <i class="bi bi-person-plus fs-1" style="color: #dfd790;"></i>
                <h3 class="fw-bold mb-0 mt-2" style="color: #dfd790;">Crear Cuenta</h3>
            </div>
            
            <div class="card-body p-4 p-md-5 bg-white">
                <form method="post" novalidate>
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    
                    <div class="d-grid mt-4 pt-2">
                        <button type="submit" class="btn text-white rounded-pill fw-semibold shadow-sm py-2" style="background-color: #631925; border: none;">
                            Registrarse
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4 pt-3 border-top">
                    <span class="text-muted small">¿Ya tienes una cuenta?</span>
                    <a href="{% url 'accounts:login' %}" class="text-decoration-none fw-semibold ms-1" style="color: #631925;">Inicia Sesión</a>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
