{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<nav class="navbar navbar-expand-lg">

<div class="container">

<a class="navbar-brand" href="{% url 'myapp:index' %}">
Sistema Académico
</a>

<button class="navbar-toggler" data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse justify-content-end" id="menu">

<ul class="navbar-nav">

<li class="nav-item">
<a class="nav-link" href="{% url 'myapp:index' %}">
<i class="bi bi-house"></i> Inicio
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{% url 'myapp:cursos' %}">
<i class="bi bi-book"></i> Cursos
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{% url 'myapp:profesores' %}">
<i class="bi bi-person-workspace"></i> Profesores
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{% url 'myapp:estudiantes' %}">
<i class="bi bi-mortarboard"></i> Estudiantes
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{% url 'myapp:entregables' %}">
<i class="bi bi-folder2-open"></i> Entregables
</a>
</li>

</ul>

</div>

</div>

</nav>

<div class="gold-line"></div>

<div class="container py-5">

{% block content %}
{% endblock %}

</div>

<footer>

Sistema Académico · Universidad

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
